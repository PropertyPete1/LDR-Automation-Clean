name: "Sync SQLite State (Encrypted)"
description: "Pull/push the SQLite audit DB from/to the 'state' branch with AES-256 encryption"
inputs:
  mode:
    description: "'pull' to fetch and decrypt state, 'push' to encrypt and commit state"
    required: true
  github_token:
    description: "GitHub token for pushing"
    required: true
  encryption_key:
    description: "AES-256 passphrase for encrypting/decrypting the state DB"
    required: true

runs:
  using: "composite"
  steps:
    - name: Pull and decrypt state from 'state' branch
      if: inputs.mode == 'pull'
      shell: bash
      env:
        STATE_KEY: ${{ inputs.encryption_key }}
      run: |
        git fetch origin state:state 2>/dev/null || true
        if git show state:pond-nurture-bot/data/fub_automation.sqlite3.enc > /dev/null 2>&1; then
          mkdir -p pond-nurture-bot/data
          git show state:pond-nurture-bot/data/fub_automation.sqlite3.enc > pond-nurture-bot/data/fub_automation.sqlite3.enc
          openssl enc -aes-256-cbc -pbkdf2 -d \
            -in pond-nurture-bot/data/fub_automation.sqlite3.enc \
            -out pond-nurture-bot/data/fub_automation.sqlite3 \
            -pass env:STATE_KEY
          rm -f pond-nurture-bot/data/fub_automation.sqlite3.enc
          echo "✅ State DB pulled and decrypted from 'state' branch"
          ls -la pond-nurture-bot/data/fub_automation.sqlite3
        else
          echo "⚠️ No encrypted state DB found on 'state' branch — will start fresh"
          mkdir -p pond-nurture-bot/data
        fi

    - name: Encrypt and push state to 'state' branch
      if: inputs.mode == 'push'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        STATE_KEY: ${{ inputs.encryption_key }}
      run: |
        if [ ! -f pond-nurture-bot/data/fub_automation.sqlite3 ]; then
          echo "⚠️ No state DB to push"
          exit 0
        fi
        # Encrypt the DB
        openssl enc -aes-256-cbc -pbkdf2 \
          -in pond-nurture-bot/data/fub_automation.sqlite3 \
          -out /tmp/fub_automation.sqlite3.enc \
          -pass env:STATE_KEY
        echo "✅ State DB encrypted ($(wc -c < /tmp/fub_automation.sqlite3.enc) bytes)"
        # Configure git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        # Checkout or create state branch.
        #
        # The old form here was
        #     git checkout state 2>/dev/null || git checkout --orphan state
        # whose fallback can never fire once `state` exists — it dies with
        # "fatal: a branch named 'state' already exists", and under this shell's
        # -e that failed the whole job. On 2026-08-11 a single modified tracked
        # file in the checkout (status/*.json) was enough to make the first
        # command refuse, and Daily Automation and Reply Detection then failed
        # at this step for sixteen hours while the bot kept sending — every
        # audit row from those runs was lost.
        #
        # Persisting state must not depend on the tidiness of a working tree it
        # does not own: -f discards local modifications to tracked files (the
        # decrypted DB is gitignored and untouched by it), and the branch is
        # created only when it genuinely does not exist.
        git fetch origin state:state 2>/dev/null || true
        if git rev-parse --verify --quiet state >/dev/null; then
          git checkout -f state
        else
          git checkout --orphan state
        fi
        # Clean working tree
        git rm -rf . 2>/dev/null || true
        # Place only the encrypted file
        mkdir -p pond-nurture-bot/data
        cp /tmp/fub_automation.sqlite3.enc pond-nurture-bot/data/fub_automation.sqlite3.enc
        git add pond-nurture-bot/data/fub_automation.sqlite3.enc
        git commit -m "state: update encrypted SQLite DB [$(date -u +%Y-%m-%dT%H:%M:%SZ)]" --allow-empty
        # Retry push up to 3 times in case another workflow pushed concurrently
        for attempt in 1 2 3; do
          if git push origin state; then
            echo "✅ Encrypted state DB pushed to 'state' branch (attempt $attempt)"
            break
          else
            echo "⚠️ Push failed (attempt $attempt), rebasing and retrying..."
            git fetch origin state
            git rebase origin/state || git rebase --abort
            # Re-apply our encrypted file on top
            mkdir -p pond-nurture-bot/data
            cp /tmp/fub_automation.sqlite3.enc pond-nurture-bot/data/fub_automation.sqlite3.enc
            git add pond-nurture-bot/data/fub_automation.sqlite3.enc
            git commit --amend --no-edit
            if [ $attempt -eq 3 ]; then
              echo "❌ State push failed after 3 attempts — forcing push"
              git push origin state --force
            fi
          fi
        done
