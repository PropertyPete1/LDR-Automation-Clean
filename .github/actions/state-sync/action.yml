name: "Sync SQLite State (Encrypted)"
description: "Pull/push the SQLite audit DB from/to the 'state' branch with AES-256 encryption, compare-and-swap and merge-on-conflict"

# The protocol lives in pond-nurture-bot/src/fub_automation/state_sync.py, which
# is where its docstring explains it and where tests/test_state_sync.py drives it
# against real git repositories. This file is the wiring only.
#
# WHY IT IS NOT A WHOLE-FILE OVERWRITE ANY MORE (issue #9)
#
# Six workflows share one DB and their cadences guarantee overlap. The old push
# encrypted whatever this job happened to hold and pushed it as a whole-file
# blob, so a job that pulled before a sibling's push and finished after it threw
# away everything the sibling had written — and both pushes reported success. It
# happened twice on 2026-08-11: Daily Automation's 150 pond sends, then the PR #6
# / #8 repair that rebuilt them, wiped by Reply Detection #459 four minutes after
# the backfill reported success. Nothing noticed either time.
#
# Now: pull records the blob SHA the DB came from; push refuses to overwrite a
# branch that has moved since, merging what is there into this run's file first
# (row-level, per table — see state_merge.py) and retrying. Git's fast-forward
# check is the compare-and-swap. There is no force push: after the last attempt
# the step FAILS, which is the whole point — a run whose rows did not land must
# not look like a run that succeeded.
#
# The push no longer checks out the 'state' branch. It builds the commit with
# plumbing against a temporary index, exactly like publish-telemetry, so HEAD,
# the current branch and the working tree are untouched. Two old hazards go with
# it: a single modified tracked file could no longer refuse the checkout, and no
# step after a push needs `actions/checkout` again to get .github/ back.
#
# The stale artifacts of the old checkout-based push (backfill-reengagement's
# "Restore the checkout" step and the wipes-the-working-tree comments in
# daily-automation.yml / reply-detection.yml) have since been removed; every
# workflow comment now describes the plumbing push above.

inputs:
  mode:
    description: "'pull' to fetch and decrypt state, 'push' to encrypt and commit state"
    required: true
  github_token:
    description: "GitHub token for pushing"
    required: true
  encryption_key:
    description: "AES-256 passphrase for encrypting/decrypting the state DB"
    required: true

runs:
  using: "composite"
  steps:
    - name: Pull and decrypt state from 'state' branch
      if: inputs.mode == 'pull'
      shell: bash
      env:
        # env:, never argv — the passphrase is handed to openssl as
        # `-pass env:STATE_KEY` so it cannot surface in a process list or a log.
        STATE_KEY: ${{ inputs.encryption_key }}
      run: |
        PYTHONPATH=pond-nurture-bot/src python3 -m fub_automation.state_sync pull

    - name: Encrypt and push state to 'state' branch
      if: inputs.mode == 'push'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        STATE_KEY: ${{ inputs.encryption_key }}
      run: |
        PYTHONPATH=pond-nurture-bot/src python3 -m fub_automation.state_sync push
