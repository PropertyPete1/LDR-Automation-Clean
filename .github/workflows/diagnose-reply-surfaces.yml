# Read-only diagnostic, run by hand. Prints, for a handful of leads, every
# FUB surface that could hold their replies: /emails, /textMessages, /notes,
# /events, plus the person record's clocks. Exists because two dry runs proved
# /emails and person.updated blind to inbound mail in this account — the fix
# for reply detection depends on seeing where the replies actually live.
#
# Every FUB call is a GET. No state DB, no writes, nothing to commit.
name: Diagnose reply surfaces

on:
  workflow_dispatch:
    inputs:
      emails:
        description: "Comma-separated lead email addresses to inspect"
        required: true
        default: "joe_munoz@att.net,sjherrera987@gmail.com"
      # BRANCH-ONLY SEAM: a freshly pushed workflow file cannot be dispatched
      # until it exists on the default branch, but a REGISTERED workflow
      # dispatched with --ref runs the ref's file — so this registered name
      # doubles as the launcher for the branch's assignment investigation.
      # mode=surfaces (default) is the original behavior.
      mode:
        description: "surfaces (reply surfaces) or assignments (timer/gate investigation)"
        required: false
        default: "surfaces"
      hours:
        description: "assignments mode: window to inspect"
        required: false
        default: "48"
      focus:
        description: "assignments mode: person id to detail"
        required: false
        default: "6327"

env:
  PYTHONUNBUFFERED: "1"
  DRY_RUN: "true"
  FUB_DISABLE_SCHEDULER: "true"
  FUB_API_KEY: ${{ secrets.FUB_API_KEY }}
  RULES_PATH: "config/rules.yaml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pond-nurture-bot/requirements.txt

      - name: Install dependencies
        run: pip install -r pond-nurture-bot/requirements.txt

      - name: Inspect reply surfaces
        if: ${{ inputs.mode != 'assignments' }}
        working-directory: pond-nurture-bot
        run: |
          set -euo pipefail
          python3 diagnose_reply_surfaces.py --emails "${{ inputs.emails }}"

      - name: Pull state DB (assignments mode)
        if: ${{ inputs.mode == 'assignments' }}
        uses: ./.github/actions/state-sync
        with:
          mode: pull
          github_token: ${{ secrets.GITHUB_TOKEN }}
          encryption_key: ${{ secrets.STATE_ENCRYPTION_KEY }}

      - name: Investigate assignments
        if: ${{ inputs.mode == 'assignments' }}
        working-directory: pond-nurture-bot
        env:
          DATABASE_PATH: "data/fub_automation.sqlite3"
        run: |
          set -euo pipefail
          python3 investigate_assignments.py \
            --hours "${{ inputs.hours }}" \
            ${{ inputs.focus && format('--focus {0}', inputs.focus) || '' }}
