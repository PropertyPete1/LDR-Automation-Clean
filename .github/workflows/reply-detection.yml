# Reply Detection — runs every 10 minutes (scans for incoming replies)
# DST note: The script handles CT timezone internally; cron fires every 10 min UTC.
name: Reply Detection

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# cancel-in-progress is FALSE on purpose. The scan takes ~7 minutes over a
# ~1,050-lead watch list, GitHub delays cron ticks under load, and with
# cancel-in-progress: true every new tick killed the still-running scan
# mid-list — 17 of 17 runs on 2026-08-24 ended "cancelled", taking the
# telemetry publish and state push with them. With false, a new tick QUEUES
# behind the running scan instead (GitHub keeps at most one pending run per
# group, so they coalesce rather than pile up).
concurrency:
  group: ldr-reply-detection
  cancel-in-progress: false

env:
  DRY_RUN: "false"
  FUB_API_KEY: ${{ secrets.FUB_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  LLM_MODEL: ${{ secrets.LLM_MODEL }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
  DATABASE_PATH: "data/fub_automation.sqlite3"
  RULES_PATH: "config/rules.yaml"

jobs:
  reply-detection:
    runs-on: ubuntu-latest
    # ~7 min is normal for the current watch list; 20 leaves room for a slow
    # FUB day without the timeout killing the run between the scan's FUB
    # writes and the state push that records them.
    timeout-minutes: 20

    # state-sync pushes to the 'state' branch, publish-telemetry pushes
    # status/ to main. Nothing here needs any other scope.
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pond-nurture-bot/requirements.txt

      - name: Install dependencies
        run: pip install -r pond-nurture-bot/requirements.txt

      - name: Pull state DB
        uses: ./.github/actions/state-sync
        with:
          mode: pull
          github_token: ${{ secrets.GITHUB_TOKEN }}
          encryption_key: ${{ secrets.STATE_ENCRYPTION_KEY }}

      - name: Run reply detection
        working-directory: pond-nurture-bot
        run: |
          echo "=== Reply Detection — DRY_RUN=$DRY_RUN ==="
          python3 -c "
          import os, sys
          sys.path.insert(0, 'src')
          os.environ['FUB_DISABLE_SCHEDULER'] = 'true'
          from fub_automation.main import AuditDB, FollowUpBossClient, RuleEngine, Rules, Settings
          settings = Settings.from_env()
          if not settings.fub_api_key:
              print('FUB_API_KEY missing — skipping')
              sys.exit(0)
          rules = Rules.load(settings.rules_path)
          db = AuditDB(settings.database_path)
          fub = FollowUpBossClient(settings)
          engine = RuleEngine(settings, rules, fub, db)
          engine.scan_reply_detection()
          print('Reply detection scan complete')
          "

      # This is the heartbeat for THE FLOOR. The daily run publishes once a
      # day; at ten-minute intervals this is what keeps last_run_iso fresh and
      # surfaces a new reply while it is still news.
      #
      # Speed-to-Lead (every 5 min) deliberately does NOT publish. All these
      # jobs share one audit DB, so its welcome emails are picked up by the
      # next run of this workflow anyway — a third publisher would only double
      # the push contention on main for at most ten minutes of latency.
      #
      # Must run before "Push state DB", which checks out the 'state' branch
      # and wipes the working tree.
      - name: Publish telemetry to THE FLOOR
        if: always()
        uses: ./.github/actions/publish-telemetry
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push state DB
        if: always()
        uses: ./.github/actions/state-sync
        with:
          mode: push
          github_token: ${{ secrets.GITHUB_TOKEN }}
          encryption_key: ${{ secrets.STATE_ENCRYPTION_KEY }}
