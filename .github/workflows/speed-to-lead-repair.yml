# One-shot repair, run by hand. Not scheduled, and it should stay that way.
#
# Re-judges every speed-to-lead warning and auto-reassignment since `since`
# under the corrected touch rule (the 2026-08-29 Sunny Chamadia incident:
# timers anchored the TOUCH check at detection time, which lags the real
# assignment by up to hours, so an agent's legitimate first touch inside the
# detection gap was ignored and the lead bounced back to Peter). False
# positives are listed; on commit the original agent is restored (unless the
# lead was manually re-routed since), the auto-reassigned tag is stripped, an
# explaining note is left, and a speed_to_lead_repair row suppresses
# re-arming for 24h.
# See pond-nurture-bot/repair_speed_to_lead_false_positives.py.
#
# Dry run by default. `commit: true` is the only thing that writes.
#
# Run the COMMIT outside business hours (before 10am / after 6pm CT) when
# possible: the 5-minute speed-to-lead tick doesn't share a concurrency group
# with this job, and a tick that pulled state before this run pushes could
# see the restore as a fresh assignment change. Two guards bound the damage —
# the scan skips repair_suppressed once the rows merge, and
# process_new_lead_timers cancels any timer a racing tick managed to arm on a
# repaired lead — but off-hours there is no race at all.
name: Repair speed-to-lead false positives

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Re-judge warnings/reassignments at/after this ISO instant"
        required: true
        default: "2026-08-28T00:00:00+00:00"
      commit:
        description: "Actually write (FUB assignment/tags/notes + state DB). Leave false for a dry run first."
        type: boolean
        required: true
        default: false

concurrency:
  group: ldr-state-write
  cancel-in-progress: false

env:
  # Unbuffered so the per-lead verdicts stream into the live log instead of
  # arriving in one block at exit.
  PYTHONUNBUFFERED: "1"
  FUB_DISABLE_SCHEDULER: "true"
  FUB_API_KEY: ${{ secrets.FUB_API_KEY }}
  DATABASE_PATH: "data/fub_automation.sqlite3"
  RULES_PATH: "config/rules.yaml"
  # The script refuses --commit under DRY_RUN=true and pins DRY_RUN=true
  # itself when --commit is absent; this env only unlocks a commit run.
  DRY_RUN: ${{ inputs.commit && 'false' || 'true' }}

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pond-nurture-bot/requirements.txt

      - name: Install dependencies
        run: pip install -r pond-nurture-bot/requirements.txt

      - name: Pull state DB
        uses: ./.github/actions/state-sync
        with:
          mode: pull
          github_token: ${{ secrets.GITHUB_TOKEN }}
          encryption_key: ${{ secrets.STATE_ENCRYPTION_KEY }}

      - name: Re-judge speed-to-lead punishments
        working-directory: pond-nurture-bot
        env:
          # Through env, not ${{ }} interpolation into the script — a
          # workflow_dispatch string must never be substituted into sh text.
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          python3 repair_speed_to_lead_false_positives.py \
            --since "$SINCE" \
            ${{ inputs.commit && '--commit' || '' }}

      # Only when something may have been written — INCLUDING a partially
      # failed commit run: the suppression rows for the leads that WERE
      # repaired must reach the state branch or the 5-minute tick re-punishes
      # them. A dry run must never touch the state branch.
      - name: Push state DB
        if: ${{ always() && inputs.commit }}
        uses: ./.github/actions/state-sync
        with:
          mode: push
          github_token: ${{ secrets.GITHUB_TOKEN }}
          encryption_key: ${{ secrets.STATE_ENCRYPTION_KEY }}

      # Re-pull rather than trusting the push: overlapping runs merge row-
      # level, so the rows must be seen ON the branch.
      - name: Re-pull and verify the repair survived
        if: ${{ always() && inputs.commit }}
        uses: ./.github/actions/state-sync
        with:
          mode: pull
          github_token: ${{ secrets.GITHUB_TOKEN }}
          encryption_key: ${{ secrets.STATE_ENCRYPTION_KEY }}

      # Compares against what THIS run said it repaired
      # (speed_to_lead_repair_summary.json, written by the script): zero
      # false positives is a legitimate outcome, not a lost write — only rows
      # that were written and then vanished on the re-pull fail the run.
      - name: Confirm the repair rows are on the state branch
        if: ${{ always() && inputs.commit }}
        working-directory: pond-nurture-bot
        run: |
          set -euo pipefail
          python3 -c "
          import json, sqlite3, sys
          summary = json.load(open('speed_to_lead_repair_summary.json'))
          expected, since = summary['repaired'], summary['since']
          c = sqlite3.connect('data/fub_automation.sqlite3')
          on_branch = c.execute(
              \"SELECT COUNT(*) FROM audit_log WHERE action='speed_to_lead_repair'\"
              \" AND created_at >= ?\", (since,)).fetchone()[0]
          print(f'this run repaired {expected}; state branch holds {on_branch} '
                f'speed_to_lead_repair row(s) since {since}')
          if expected > 0 and on_branch == 0:
              print('commit run wrote rows that did not survive the push — investigate')
              sys.exit(1)
          "
